[backlog.7.hard_wires.status_enum_normalization]
location = "aeon/orchestration/step_prep.py - get_ready_steps() method"
issue = "PlanStep.status may be deserialized as string 'pending' instead of StepStatus.PENDING enum, causing step.status == StepStatus.PENDING comparison to fail and preventing step execution"
workaround = "Normalize status to enum in get_ready_steps() before comparison: if isinstance(step.status, str): step.status = StepStatus(step.status.lower())"
rationale = "Temporary workaround to ensure steps execute correctly while proper Pydantic enum deserialization is addressed in validation sprint"
removal = "Replace with proper Pydantic model_validate() usage and/or field validators in PlanParser.parse() when validation infrastructure is implemented"
note = "Root cause: Pydantic use_enum_values=True serializes enums to strings, but deserialization may not always convert strings back to enums when using Plan(**plan_dict) instead of Plan.model_validate(plan_dict)"

